<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="A Frontend-Mentor challenge" />
		<link rel="stylesheet" href="css/main.css" />
		<link
			rel="shortcut icon"
			href="assets/images/favicon-32x32.png"
			type="image/x-icon"
		/>
		<title>Document</title>
	</head>
	<body>
		<main>
			<section class="profile__card">
				<section class="profile__image-container">
					<img
						class="profile__image"
						src="assets/images/avatar-jessica.jpeg"
						alt="Jessica Randall"
					/>
				</section>

				<section class="profile__details">
					<h1 class="profile__name">Jessica Randall</h1>
					<p class="profile__address">London, United Kingdom</p>
					<p class="profile__job">"Front-end developer and avid reader."</p>
				</section>

				<section class="profile__links">
					<a class="profile__link" href="">Github</a>
					<a class="profile__link" href="">Frontend Mentor</a>
					<a class="profile__link" href="">Linkedin</a>
					<a class="profile__link" href="">Twitter</a>
					<a class="profile__link" href="">Instagram</a>
				</section>
			</section>
		</main>
	</body>
</html>
